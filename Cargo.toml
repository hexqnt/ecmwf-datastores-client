[package]
name = "ecmwf-datastores-client"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Async Rust client for ECMWF Data Stores APIs with resumable jobs and streaming assets"
authors = ["hexqnt <hexqntlab@gmail.com>"]
repository = "https://github.com/hexqnt/ecmwf-datastores-client"
documentation = "https://docs.rs/ecmwf-datastores-client"
readme = "README.md"
keywords = ["ecmwf", "cds", "ads", "ewds", "copernicus"]
categories = ["science", "api-bindings"]

include = [
    "src/**",
    "Cargo.toml",
    "README.md",
    "README.ru.md",
    "LICENSE*",
    "examples/**",
    "tests/**",
    "benches/**",
]

[features]
default = ["discovery"]
discovery = ["dep:config", "dep:dirs", "dep:shellexpand"]

[dependencies]
bytes = "1"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "serde",
] }
config = { version = "0.15", default-features = false, features = [
    "yaml",
], optional = true }
dirs = { version = "7.0", optional = true }
futures-core = "0.3"
futures-util = "0.3"
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "stream",
    "gzip",
    "brotli",
    "deflate",
    "rustls",
] }
rustls = "0.23"
rustls-platform-verifier = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = { version = "3.1", optional = true }
tempfile = "3.10"
thiserror = "2.0"
tokio = { version = "1", features = ["fs", "io-util", "rt", "time"] }
url = "2.5"

[dev-dependencies]
approx = "0.5.1"
criterion = "0.8.2"
pretty_assertions = "1.4"
reqwest = { version = "0.13", default-features = false, features = ["zstd"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.bench]
debug = 1
strip = false

[profile.profiling]
inherits = "release"
debug = 1
strip = false

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_const_for_fn = "allow"

[workspace]
members = ["crates/ecmwf-datastores-cli"]
resolver = "3"

[[example]]
name = "catalogue"
required-features = ["discovery"]

[[example]]
name = "queue_job"
required-features = ["discovery"]

[[example]]
name = "resume_job"
required-features = ["discovery"]

[[example]]
name = "retrieve"
required-features = ["discovery"]

[[test]]
name = "live_api"
required-features = ["discovery"]

[[bench]]
name = "planner"
harness = false

[[bench]]
name = "download"
harness = false

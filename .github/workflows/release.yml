name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify CLI version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches CLI version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "ecmwf-datastores-cli"))')
          test "$GITHUB_REF_NAME" = "v$version"

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: ecmwf-datastores-linux-x86_64-gnu.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: ecmwf-datastores-linux-x86_64-musl.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: ecmwf-datastores-windows-x86_64-msvc.zip
          - os: macos-14
            target: aarch64-apple-darwin
            archive: ecmwf-datastores-macos-aarch64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        if: matrix.target != 'x86_64-unknown-linux-musl'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        if: matrix.target != 'x86_64-unknown-linux-musl'
        uses: Swatinem/rust-cache@v2

      - name: Build
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: cargo build -p ecmwf-datastores-cli --bin ecmwf-datastores --locked --release --target ${{ matrix.target }}

      - name: Build with musl
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          docker run --rm \
            -e CXX=g++ \
            -v "${{ github.workspace }}:/volume" \
            clux/muslrust:stable \
            cargo build -p ecmwf-datastores-cli --bin ecmwf-datastores --locked --release --target x86_64-unknown-linux-musl

      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/ecmwf-datastores" dist/
          tar -C dist -czf "${{ matrix.archive }}" ecmwf-datastores

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\ecmwf-datastores.exe" dist/
          Compress-Archive -Path dist/ecmwf-datastores.exe -DestinationPath "${{ matrix.archive }}"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload archives
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*

dataset = "reanalysis-era5-pressure-levels"
output = "downloads/era5-temperature.nc"

[bbox]
# User-friendly [min, max] order. CDS receives [north, west, south, east].
lat = [50.0, 60.0]
lon = [20.0, 40.0]

[time]
start = "2024-01-01"
end = "2024-01-31"
times = ["00:00", "06:00", "12:00", "18:00"]

[split]
# Conservative default below the commonly reported CDS limit of 120,000 items.
max_items = 100000
# Bound the total number of server requests used to build the output.
max_requests = 1000

[request]
product_type = ["reanalysis"]
variable = ["temperature", "geopotential"]
pressure_level = ["500", "700", "850", "1000"]
data_format = "netcdf"
download_format = "unarchived"

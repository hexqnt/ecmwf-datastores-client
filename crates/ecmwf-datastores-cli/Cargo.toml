[package]
name = "ecmwf-datastores-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Command-line retrieval tool for ECMWF Data Stores"
repository = "https://github.com/hexqnt/ecmwf-datastores-client"
readme = "README.md"
publish = false

[features]
default = ["netcdf-assembly"]
netcdf-assembly = ["dep:netcdf"]

[[bin]]
name = "ecmwf-datastores"
path = "src/main.rs"
doc = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
colored = "3.1.1"
console = "0.16.6"
ecmwf-datastores-client = { path = "../.." }
env_logger = "0.11"
indicatif = "0.18.6"
netcdf = { version = "0.12.1", default-features = false, features = [
    "static",
], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
toml = "1.1"

[dev-dependencies]
approx = "0.5.1"
criterion = "0.8.2"
tokio = { version = "1", features = ["io-util", "net"] }

[[bench]]
name = "assembly"
harness = false
required-features = ["netcdf-assembly"]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
missing_const_for_fn = "allow"
